<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Crea un commit desde PyCharm</title>
  <desc id="desc">Panel Commit de PyCharm mostrando dos archivos seleccionados, un mensaje de commit y los botones Commit y Commit and Push.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-8%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#20283a" flood-opacity=".12"/></filter>
    <style>
      .text { font: 17px Arial, sans-serif; fill: #20252d; }
      .small { font: 14px Arial, sans-serif; fill: #586273; }
      .tiny { font: 12px Arial, sans-serif; fill: #7b8492; }
      .number { font: bold 18px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="1000" height="700" rx="18" fill="#f5f6f8"/>
  <rect x="1" y="1" width="998" height="698" rx="17" fill="none" stroke="#dfe3e9"/>
  <rect x="0" y="0" width="1000" height="45" rx="18" fill="#fff"/>
  <path d="M0 45h1000" stroke="#e2e5e9"/>
  <text x="20" y="29" class="text" font-weight="bold">Commit</text>
  <circle cx="950" cy="22" r="2" fill="#798392"/><circle cx="950" cy="29" r="2" fill="#798392"/><circle cx="950" cy="36" r="2" fill="#798392"/>
  <rect x="0" y="46" width="56" height="654" fill="#eef0f3"/>
  <rect x="7" y="62" width="42" height="42" rx="9" fill="#3478e5"/>
  <path d="M20 83h16m-8-8v16" stroke="#fff" stroke-width="2"/>
  <path d="M19 128h18m-18 5h18" stroke="#7d8794" stroke-width="2"/>
  <circle cx="28" cy="176" r="9" fill="none" stroke="#7d8794" stroke-width="2"/><path d="M28 169v7l5 3" fill="none" stroke="#7d8794" stroke-width="2"/>
  <rect x="57" y="58" width="926" height="335" rx="8" fill="#fff"/>
  <rect x="57" y="58" width="926" height="39" rx="8" fill="#e9f0fd"/>
  <path d="M57 97h926" stroke="#d9e1ed"/>
  <path d="M76 71v14m-7-7 7-7 7 7" fill="none" stroke="#707b8b" stroke-width="1.6"/>
  <rect x="101" y="69" width="17" height="17" rx="3" fill="#fff" stroke="#8190a6"/>
  <path d="m104 77 4 4 8-9" fill="none" stroke="#3578df" stroke-width="2"/>
  <text x="130" y="84" class="text" font-weight="bold">Changes: 2 files</text>
  <rect x="101" y="112" width="17" height="17" rx="3" fill="#fff" stroke="#8190a6"/>
  <path d="m104 120 4 4 8-9" fill="none" stroke="#3578df" stroke-width="2"/>
  <path d="M129 115h16v16h-16z" fill="#e7efff" stroke="#6681ad"/><path d="M132 119h10m-10 4h10m-10 4h7" stroke="#6681ad"/>
  <text x="157" y="128" class="small" fill="#2666c7">01_hola_python.py</text><text x="348" y="128" class="tiny">modulo-01/ejercicios</text>
  <rect x="101" y="148" width="17" height="17" rx="3" fill="#fff" stroke="#8190a6"/>
  <path d="m104 156 4 4 8-9" fill="none" stroke="#3578df" stroke-width="2"/>
  <path d="M130 151h16v16h-16z" fill="#f0f4fa" stroke="#718099"/><text x="157" y="164" class="small" fill="#2666c7">.gitignore</text><text x="256" y="164" class="tiny">RAGLAB</text>
  <path d="M76 193v8m0-4 6-6m-6 6-6-6" fill="none" stroke="#737d8b" stroke-width="1.5"/>
  <text x="99" y="202" class="small" font-weight="bold">Unversioned Files</text><text x="221" y="202" class="tiny">0 files · .idea is ignored</text>
  <rect x="57" y="407" width="926" height="234" rx="8" fill="#fff" stroke="#e3e6eb"/>
  <rect x="76" y="427" width="18" height="18" rx="3" fill="#fff" stroke="#9aa4b3"/>
  <text x="104" y="442" class="small">Amend last commit</text>
  <rect x="76" y="465" width="887" height="116" rx="7" fill="#fff" stroke="#cbd2dc"/>
  <text x="91" y="502" font-family="Courier New,monospace" font-size="22" fill="#778297">Mensaje del commit</text>
  <text x="91" y="536" class="small" fill="#8a93a0">Describe brevemente los cambios que vas a guardar.</text>
  <rect x="77" y="600" width="106" height="36" rx="6" fill="#3478e5"/>
  <text x="103" y="624" class="small" fill="#fff" font-weight="bold">Commit</text>
  <rect x="194" y="600" width="178" height="36" rx="6" fill="#fff" stroke="#cbd2dc"/>
  <text x="207" y="624" class="small">Commit and Push...</text>
  <circle cx="85" cy="77" r="17" fill="#28735e" stroke="#fff" stroke-width="3"/><text x="85" y="77" class="number">1</text>
  <circle cx="84" cy="476" r="17" fill="#28735e" stroke="#fff" stroke-width="3"/><text x="84" y="476" class="number">2</text>
  <circle cx="78" cy="618" r="17" fill="#28735e" stroke="#fff" stroke-width="3"/><text x="78" y="618" class="number">3</text>
</svg>
