<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Bucles for y while</title><desc id="desc">Un bucle recorre una lista y repite la misma acción para cada elemento.</desc>
  <rect width="640" height="360" rx="24" fill="#f4f8f5"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24332e">Repite una acción por cada elemento</text>
  <rect x="28" y="64" width="584" height="72" rx="14" fill="#202633"/><text x="50" y="94" font-family="Consolas,monospace" font-size="15" fill="#d9e2ef">for tema in ["RAG", "Python", "Git"]:</text><text x="72" y="118" font-family="Consolas,monospace" font-size="14" fill="#9de1bd">    print(tema)</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="54" y="181" width="125" height="49" rx="12" fill="#fff" stroke="#cfe2d6"/><text x="116" y="211" font-size="15" font-weight="700" fill="#25332e">RAG</text><rect x="257" y="181" width="125" height="49" rx="12" fill="#fff" stroke="#cfe2d6"/><text x="319" y="211" font-size="15" font-weight="700" fill="#25332e">Python</text><rect x="460" y="181" width="125" height="49" rx="12" fill="#fff" stroke="#cfe2d6"/><text x="522" y="211" font-size="15" font-weight="700" fill="#25332e">Git</text></g>
  <path d="M179 205h64m-9-8 9 8-9 8m139-8h64m-9-8 9 8-9 8" fill="none" stroke="#4a9b79" stroke-width="3"/><path d="M522 238v30H116v-30" fill="none" stroke="#8a94a2" stroke-width="2" stroke-dasharray="5 5"/><path d="m108 248 8-10 8 10" fill="none" stroke="#8a94a2" stroke-width="2"/><text x="320" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5e6b64">El bucle termina cuando ya recorrió toda la lista.</text><text x="320" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#4b7f69">for recorre elementos　·　while repite mientras una condición sea verdadera</text>
</svg>
