<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Condicionales if, elif y else</title><desc id="desc">Un diagrama de decisión muestra cómo una condición dirige el programa por una de dos rutas.</desc>
  <rect width="640" height="360" rx="24" fill="#f4f8f5"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24332e">La condición elige qué hacer</text>
  <rect x="28" y="64" width="584" height="72" rx="14" fill="#202633"/><text x="50" y="94" font-family="Consolas,monospace" font-size="15" fill="#d9e2ef">if temperatura &gt;= 30:</text><text x="72" y="118" font-family="Consolas,monospace" font-size="14" fill="#9de1bd">    print("Hace calor")</text>
  <path d="M320 136v25m0 0-120 47m120-47 120 47" fill="none" stroke="#5b9c7b" stroke-width="3"/>
  <rect x="109" y="204" width="160" height="36" rx="18" fill="#dff2e7"/><text x="189" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#28664e">Sí: if / elif</text>
  <rect x="371" y="204" width="160" height="36" rx="18" fill="#ece8fb"/><text x="451" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5b4bc4">No: else</text>
  <path d="M189 240v22m262-22v22" stroke="#8a94a2" stroke-width="2"/><rect x="74" y="264" width="230" height="54" rx="12" fill="#fff" stroke="#cfe2d6"/><text x="189" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64716b">Ejecuta la instrucción</text><text x="189" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#25332e">Hace calor</text><rect x="336" y="264" width="230" height="54" rx="12" fill="#fff" stroke="#ddd7f2"/><text x="451" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64716b">Si ninguna condición se cumple</text><text x="451" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#25332e">Usa else</text>
</svg>
