<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Funciones y valores de retorno</title><desc id="desc">Una función recibe un nombre, ejecuta instrucciones y devuelve un saludo.</desc>
  <rect width="640" height="360" rx="24" fill="#f4f8f5"/><text x="30" y="43" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#24332e">Una función recibe, procesa y devuelve</text>
  <rect x="28" y="66" width="350" height="246" rx="16" fill="#202633"/><text x="50" y="102" font-family="Consolas,monospace" font-size="14" fill="#b5a1f0">def <tspan fill="#9de1bd">saludar</tspan>(nombre):</text><text x="72" y="136" font-family="Consolas,monospace" font-size="14" fill="#d9e2ef">mensaje = f"Hola, {nombre}"</text><text x="72" y="170" font-family="Consolas,monospace" font-size="14" fill="#d9e2ef">return mensaje</text><line x1="50" y1="196" x2="354" y2="196" stroke="#46505e"/><text x="50" y="231" font-family="Consolas,monospace" font-size="14" fill="#d9e2ef">saludar("Ada")</text><text x="50" y="276" font-family="Consolas,monospace" font-size="14" fill="#9de1bd"># "Hola, Ada"</text>
  <path d="M378 137h54m-9-8 9 8-9 8" fill="none" stroke="#4a9b79" stroke-width="3"/><rect x="443" y="98" width="166" height="82" rx="15" fill="#e0f2e7" stroke="#c2e2cf"/><text x="526" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#4b7f69">ENTRADA</text><text x="526" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25332e">nombre = Ada</text>
  <path d="M526 181v42m0 0-32 25m32-25 32 25" fill="none" stroke="#8a94a2" stroke-width="2"/><rect x="418" y="251" width="196" height="52" rx="13" fill="#fff" stroke="#cfe2d6"/><text x="516" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#4b7f69">RESULTADO</text><text x="516" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#25332e">Hola, Ada</text>
</svg>
