<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Selecciona el entorno Conda RAGLAB existente</title>
  <desc id="desc">Ventana Add Python Interpreter de PyCharm con Select existing, Conda, el entorno RAGLAB y el botón OK destacados con los pasos 3 y 4.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20283a" flood-opacity=".16"/></filter>
    <style>
      .text { font: 20px Arial, sans-serif; fill: #22252a; }
      .small { font: 17px Arial, sans-serif; fill: #4f5661; }
      .muted { font: 16px Arial, sans-serif; fill: #68717f; }
      .number { font: bold 18px Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="960" height="480" rx="18" fill="#f4f5f7"/>
  <rect x="1" y="1" width="958" height="478" rx="17" fill="none" stroke="#dfe3e9"/>
  <g filter="url(#shadow)"><rect x="30" y="24" width="900" height="432" rx="14" fill="#fff" stroke="#d4d8df"/></g>
  <rect x="30" y="24" width="900" height="54" rx="14" fill="#fafbfc"/>
  <path d="M30 78h900" stroke="#e4e7ec"/>
  <rect x="48" y="37" width="18" height="18" rx="2" fill="#198c65"/><text x="52" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff">PC</text>
  <text x="80" y="60" class="text">Add Python Interpreter</text>
  <path d="m900 43 15 15m0-15-15 15" stroke="#777f8c" stroke-width="1.8"/>
  <text x="62" y="119" class="text">Environment:</text>
  <circle cx="206" cy="112" r="10" fill="#fff" stroke="#aeb5c0" stroke-width="2"/><text x="228" y="119" class="small">Generate new</text>
  <circle cx="386" cy="112" r="10" fill="#3478f6"/><circle cx="386" cy="112" r="4" fill="#fff"/><text x="408" y="119" class="small" font-weight="bold">Select existing</text>
  <text x="62" y="169" class="text">Type:</text>
  <rect x="174" y="143" width="165" height="39" rx="6" fill="#fff" stroke="#cbd1da"/>
  <circle cx="195" cy="162" r="9" fill="none" stroke="#42a96a" stroke-width="2"/><path d="M191 162a4 4 0 1 1 4 4" fill="none" stroke="#42a96a" stroke-width="2"/>
  <text x="216" y="169" class="small">Conda</text><path d="m314 158 6 6 6-6" fill="none" stroke="#7b8492" stroke-width="1.7"/>
  <text x="62" y="229" class="text">Path to conda:</text>
  <rect x="174" y="201" width="720" height="39" rx="6" fill="#fff" stroke="#cbd1da"/>
  <text x="190" y="227" class="small">C:\Users\&lt;usuario&gt;\miniconda3\condabin\conda.bat</text>
  <path d="m843 219 7 7 11-13" fill="none" stroke="#35a76a" stroke-width="3"/><path d="M877 212h12l6 6v12h-18z" fill="#f3f6fa" stroke="#8e98a7"/><path d="M889 212v6h6" fill="none" stroke="#8e98a7"/>
  <text x="62" y="289" class="text">Environment:</text>
  <rect x="174" y="261" width="720" height="40" rx="6" fill="#fff" stroke="#3478f6" stroke-width="2"/>
  <circle cx="195" cy="281" r="9" fill="none" stroke="#42a96a" stroke-width="2"/><path d="M191 281a4 4 0 1 1 4 4" fill="none" stroke="#42a96a" stroke-width="2"/>
  <text x="216" y="288" class="small" font-weight="bold">RAGLAB</text><path d="m866 276 6 6 6-6" fill="none" stroke="#7b8492" stroke-width="1.7"/>
  <text x="704" y="334" class="muted">Reload environments</text>
  <circle cx="64" cy="412" r="13" fill="#fff" stroke="#cbd1da"/><text x="59" y="418" class="small">?</text>
  <rect x="727" y="392" width="91" height="43" rx="7" fill="#3478e5"/><text x="754" y="420" class="small" fill="#fff" font-weight="bold">OK</text>
  <rect x="831" y="392" width="80" height="43" rx="7" fill="#fff" stroke="#cbd1da"/><text x="847" y="420" class="small">Cancel</text>
  <circle cx="386" cy="112" r="18" fill="none" stroke="#6b55c9" stroke-width="3"/>
  <circle cx="158" cy="280" r="17" fill="#6b55c9" stroke="#fff" stroke-width="3"/><text x="158" y="280" class="number">4</text>
  <circle cx="727" cy="412" r="17" fill="#6b55c9" stroke="#fff" stroke-width="3"/><text x="727" y="412" class="number">5</text>
</svg>
